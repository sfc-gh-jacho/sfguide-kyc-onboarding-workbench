<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Try the KYC onboarding workbench in your browser</title>
  <meta name="description" content="A synthetic-data KYC onboarding workbench that runs entirely in your browser. No Snowflake account needed." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css" />
  <style>
    body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 14px; background: #fff; color: #11567F; z-index: 10; text-align: center; padding: 24px; }
    #loading h1 { font-size: 1.4rem; margin: 0; }
    #loading p { margin: 0; color: #5B7083; max-width: 520px; line-height: 1.5; }
    .spinner { width: 42px; height: 42px; border: 4px solid #d0e8f2; border-top-color: #29B5E8; border-radius: 50%;
               animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Starting the KYC onboarding workbench</h1>
    <p>Python is loading in your browser. The first visit takes about 20 to 40 seconds; later visits are faster.
       All data is synthetic, and nothing you do here leaves this page.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";

    const files = [
      "streamlit_app.py",
      "app_pages/overview.py", "app_pages/intake.py", "app_pages/identity.py", "app_pages/risk.py",
      "app_pages/screening.py", "app_pages/decision.py", "app_pages/governance.py", "app_pages/about.py",
      "kyc/__init__.py", "kyc/data.py", "kyc/logic.py", "kyc/source.py", "kyc/ui.py", "kyc/ai.py", "kyc/documents.py",
      "data/captured_ai.json", "static/Inter-Regular.ttf", "static/Inter-SemiBold.ttf",
    ];

    const controller = mount(
      {
        requirements: ["pandas", "numpy", "altair", "pillow"],
        entrypoint: "streamlit_app.py",
        files: Object.fromEntries(files.map((f) => [f, { url: `../${f}` }])),
        streamlitConfig: {
          "client.toolbarMode": "viewer",
          "theme.base": "light",
          "theme.primaryColor": "#29B5E8",
          "theme.backgroundColor": "#ffffff",
          "theme.secondaryBackgroundColor": "#f4f9fc",
          "theme.textColor": "#11567F",
          "theme.linkColor": "#29B5E8",
          "theme.borderColor": "#d0e8f2",
          "theme.showWidgetBorder": true,
          "theme.baseRadius": "8px",
          "theme.blueColor": "#29B5E8",
          "theme.greenColor": "#36B37E",
          "theme.orangeColor": "#FF8B00",
          "theme.redColor": "#DE350B",
          "theme.violetColor": "#6554C0",
          "theme.sidebar.backgroundColor": "#11567F",
          "theme.sidebar.secondaryBackgroundColor": "#174D6A",
          "theme.sidebar.textColor": "#ffffff",
          "theme.sidebar.borderColor": "#1E6D94",
        },
      },
      document.getElementById("root"),
    );

    // Hide the loading screen once Streamlit has drawn the app
    const hide = () => document.getElementById("loading")?.remove();
    const obs = new MutationObserver(() => {
      if (document.querySelector('[data-testid="stSidebar"], [data-testid="stAppViewContainer"] h1')) { hide(); obs.disconnect(); }
    });
    obs.observe(document.getElementById("root"), { childList: true, subtree: true });
    setTimeout(hide, 90000);
  </script>
</body>
</html>
